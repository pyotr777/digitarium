  <div id="main" class="wrapper-content">

    <h1>TAGS</h1>

    <script type="text/python">
      # Collect tags from <meta name="keywords"> of every page and print:
      #   1. a tag cloud with counts (links to anchors below)
      #   2. a section per tag with the list of pages carrying it
      import glob
      import os
      from datetime import date
      from urllib.parse import quote

      from bs4 import BeautifulSoup

      site_root = os.path.dirname(os.path.dirname(__file__))  # rawsite/

      # Relative path from this page to the site root
      base_url = os.path.relpath(site_root, os.path.dirname(page_file))
      base_url = "" if base_url == "." else base_url + "/"

      # Posts are top-level directories with an index.html; pages without
      # <meta name="keywords"> (tags, blog indexes) are skipped below
      posts = []
      for path in sorted(glob.glob(os.path.join(site_root, "*", "index.html"))):
          with open(path, encoding="utf-8") as f:
              s = BeautifulSoup(f.read(), "html.parser")
          meta = s.find("meta", attrs={"name": "keywords"})
          if not meta:
              continue
          tags = [t.strip() for t in meta.get("content", "").split(",") if t.strip()]
          if not tags:
              continue
          main = s.find(class_="wrapper-content") or s
          h1 = main.find("h1")
          date_el = main.find(class_="date")
          d = date.fromisoformat(date_el.get_text().strip()) if date_el else date.min
          name = os.path.basename(os.path.dirname(path))
          posts.append({
              "url": f"{base_url}{name}/index.html",
              "title": h1.decode_contents().strip() if h1 else name,
              "date": d,
              "tags": tags,
          })

      # Tag order: first appearance, walking posts from oldest to newest
      # (same order as on the old Jekyll site)
      tag_posts = {}
      for post in sorted(posts, key=lambda p: p["date"]):
          for tag in post["tags"]:
              tag_posts.setdefault(tag, []).append(post)

      print('<div class="tags">')

      # Tag cloud with counts
      print('  <ul class="label">')
      for tag, tagged in tag_posts.items():
          print(f'    <li><a href="#{quote(tag)}"><span>{tag}</span><span class="count">{len(tagged)}</span></a></li>')
      print('  </ul>')

      # One section per tag, articles newest first
      for tag, tagged in tag_posts.items():
          print(f'  <h2 id="{tag}">{tag}</h2>')
          print('  <ul class="tag">')
          for post in sorted(tagged, key=lambda p: p["date"], reverse=True):
              print(f'    <li><a href="{post["url"]}">{post["title"]}</a> <time>{post["date"]}</time></li>')
          print('  </ul>')

      print('</div>')
    </script>
