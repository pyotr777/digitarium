<script type="text/python">
  # Post list with pagination.
  # Parameters (all optional):
  #   section  - show only pages with <meta name="section" content="...">, default "main"
  import glob
  import os
  import sys
  from datetime import date

  from bs4 import BeautifulSoup

  section = params.get("section", "main")

  site_root = os.path.dirname(os.path.dirname(__file__))  # rawsite/

  posts = []
  for path in sorted(glob.glob(os.path.join(site_root, "pages", "*", "index.html"))):
      with open(path, encoding="utf-8") as f:
          s = BeautifulSoup(f.read(), "html.parser")
      sec = s.find("meta", attrs={"name": "section"})
      if not sec or sec.get("content") != section:
          continue
      main = s.find(class_="wrapper-content") or s
      h1 = main.find("h1")
      date_el = main.find(class_="date")
      d = date.fromisoformat(date_el.get_text().strip()) if date_el else None
      desc = s.find("meta", attrs={"name": "description"})
      description = desc.get("content", "").strip() if desc else ""
      if description:
          description = "<p>" + description + "</p>"
      else:
          # Fall back to the first paragraph of the article (like Jekyll's excerpt)
          p = main.find("p")
          description = str(p) if p else ""
      name = os.path.basename(os.path.dirname(path))
      posts.append({
          "url": f"/pages/{name}/",
          "title": h1.decode_contents().strip() if h1 else name,
          "date_str": date_el.get_text().strip() if date_el else "",
          "description": description,
          "date": d,
      })

  posts.sort(key=lambda p: p["date"], reverse=True)
  total_pages = len(posts)

  print('<div class="posts">')
  for post in posts:
      print('  <article class="post">')
      print('    <h1>')
      print(f'      <a href="{post["url"]}">{post["title"]}</a>')
      print('    </h1>')
      print('    <div class="meta">')
      print('      <span class="date">')
      print(f'        {post["date"]}')
      print('      </span>')
      print('    </div>')
      print('    <div class="entry">')
      print(f'      {post["description"]}')
      print('    </div>')
      print(f'    <a href="{post["url"]}" class="read-more">Read More</a>')
      print('  </article>')
      print()
  print('</div>')

</script>
