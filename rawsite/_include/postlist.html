<script type="text/python">
  # Post list with pagination.
  # Parameters (all optional):
  #   section  - show only pages with <meta name="section" content="...">, default "main"
  import glob
  import os
  import sys
  from datetime import date
  from urllib.parse import quote

  from bs4 import BeautifulSoup

  section = params.get("section", "main")
  lang = params.get("lang", None)

  site_root = os.path.dirname(os.path.dirname(__file__))  # rawsite/

  # Relative path from the page being rendered to the site root, so that the
  # same template works from "/", "/blog/" and "/blog/ru/"
  base_url = os.path.relpath(site_root, os.path.dirname(page_file))
  base_url = "" if base_url == "." else base_url + "/"

  # Posts are top-level directories with an index.html; pages without a
  # <meta name="section"> (tags, blog indexes) are skipped by the filter below
  posts = []
  for path in sorted(glob.glob(os.path.join(site_root, "*", "index.html"))):
      with open(path, encoding="utf-8") as f:
          s = BeautifulSoup(f.read(), "html.parser")
      sec = s.find("meta", attrs={"name": "section"})
      if not sec or sec.get("content") != section:
          continue
      lang_detected = s.find("meta", attrs={"name": "language"})
      if lang_detected is not None and lang is not None and lang_detected.get("content") != lang:
          continue
      main = s.find(class_="wrapper-content") or s
      h1 = main.find("h1")
      date_el = main.find(class_="date")
      d = date.fromisoformat(date_el.get_text().strip()) if date_el else None
      desc = s.find("meta", attrs={"name": "description"})
      

      description = desc.get("content", "").strip() if desc else ""
      if description:
          description = "<p>" + description + "</p>"
      else:
          # Fall back to the first paragraph of the article (like Jekyll's excerpt)
          p = main.find("p")
          description = str(p) if p else ""
      kw = s.find("meta", attrs={"name": "keywords"})
      tags = [t.strip() for t in kw.get("content", "").split(",") if t.strip()] if kw else []
      name = os.path.basename(os.path.dirname(path))
      posts.append({
          "url": f"{base_url}{name}/index.html",
          "title": h1.decode_contents().strip() if h1 else name,
          "date_str": date_el.get_text().strip() if date_el else "",
          "description": description,
          "date": d,
          "tags": tags,
      })

  posts.sort(key=lambda p: p["date"], reverse=True)
  total_pages = len(posts)

  # Accordion: group posts by year (already newest first, so the dict
  # keeps years in descending order); the two most recent years with
  # posts start opened (<details open>)
  years = {}
  for post in posts:
      years.setdefault(post["date"].year, []).append(post)

  print('<div class="posts">')
  for i, (year, year_posts) in enumerate(years.items()):
      open_attr = " open" if i < 2 else ""
      print(f'  <details class="year"{open_attr}>')
      print(f'    <summary>{year} <span class="count">({len(year_posts)})</span></summary>')
      for post in year_posts:
          print('  <article class="post">')
          print('    <h1>')
          print(f'      <a href="{post["url"]}">{post["title"]}</a>')
          print('    </h1>')
          print('    <div class="meta">')
          print('      <span class="date">')
          print(f'        {post["date"]}')
          print('      </span>')
          if post["tags"]:
              print('      <ul class="tag">')
              for tag in post["tags"]:
                  print(f'        <li><a href="{base_url}tags/index.html#{quote(tag)}">{tag}</a></li>')
              print('      </ul>')
          print('    </div>')
          print('    <div class="entry">')
          print(f'      {post["description"]}')
          print('    </div>')
          print(f'    <a href="{post["url"]}" class="read-more">Read More</a>')
          print('  </article>')
          print()
      print('  </details>')
  print('</div>')

</script>
