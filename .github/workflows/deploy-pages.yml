name: Build and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the build dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.15.0

      - name: Get Panehe
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/pyotr777/panehe/2a64e58bf873b3299823349b40b7aed723efe3ef/panehe.py \
            --output panehe.py
          echo 'a71f398c82f8c0d85c64cb7e1490b0f99da880f1f17246f07d61c426f9a5dfa9  panehe.py' | sha256sum --check

      - name: Build the site
        run: python panehe.py rawsite -o _site

      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
